<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeemaDrishti - Border Intelligence Platform</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF9933' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3C/svg%3E">
  <meta name="description" content="SeemaDrishti: Advanced Border Intelligence Platform by the Ministry of Defence.">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --color-olive: #547A4F;
  --color-sage: #78A578;
  --color-khaki: #E3D8A2;
  --color-brown: #6B5743;
  --color-slate: #4D5363;
  --color-bg: #0a0c10;
  --color-panel: rgba(77, 83, 99, 0.15);
  --color-border: rgba(120, 165, 120, 0.2);
}

body, html {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  background-color: var(--color-bg);
  color: var(--color-khaki);
  font-family: 'Outfit', sans-serif;
  overflow: hidden;
  display: flex;
}

#root {
  display: flex;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  position: relative;
  z-index: 10;
}

/* Landing Page Styles */
.landing-page {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 100;
}

.landing-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(to bottom, rgba(10, 12, 16, 0.3), rgba(10, 12, 16, 0.95));
  z-index: 1;
}

.landing-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  animation: fadeIn 1.8s ease-out;
  gap: 12px;
}

.landing-top-badge {
  font-family: monospace;
  font-size: 11px;
  letter-spacing: 3px;
  color: rgba(255, 153, 51, 0.6);
  border: 1px solid rgba(255, 153, 51, 0.2);
  padding: 5px 14px;
  border-radius: 2px;
  margin-bottom: 8px;
  background: rgba(0,0,0,0.4);
}

.landing-logo-ring {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 2px solid rgba(255, 153, 51, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  margin-bottom: 4px;
  box-shadow: 0 0 30px rgba(255, 153, 51, 0.2), inset 0 0 20px rgba(255, 153, 51, 0.05);
  animation: rotateBorder 8s linear infinite;
}

@keyframes rotateBorder {
  0% { box-shadow: 0 0 30px rgba(255,153,51,0.2), 0 0 0 0 rgba(19,136,8,0.3); }
  50% { box-shadow: 0 0 40px rgba(19,136,8,0.3), 0 0 0 0 rgba(255,153,51,0.2); }
  100% { box-shadow: 0 0 30px rgba(255,153,51,0.2), 0 0 0 0 rgba(19,136,8,0.3); }
}

.landing-logo-ring::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px dashed rgba(255, 153, 51, 0.25);
  animation: spin 20s linear infinite;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.landing-title {
  font-size: 80px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 18px;
  margin: 0;
  text-shadow: 0 0 40px rgba(255,153,51,0.4), 0 4px 30px rgba(0,0,0,0.9);
  line-height: 1;
}

.landing-typewriter {
  font-family: monospace;
  font-size: 16px;
  color: var(--color-sage);
  letter-spacing: 3px;
  text-transform: uppercase;
  min-height: 24px;
  margin: 4px 0 16px;
}

@keyframes blink-cursor { 0%,100% { opacity:1; } 50% { opacity:0; } }
.cursor-blink {
  animation: blink-cursor 0.9s step-end infinite;
  color: #FF9933;
  font-weight: 300;
}

.landing-actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  margin-top: 8px;
}

.landing-clearance {
  font-family: monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.25);
  text-transform: uppercase;
}

.landing-btn {
  background: transparent;
  border: 1px solid rgba(255, 153, 51, 0.8);
  color: #FF9933;
  padding: 16px 52px;
  font-size: 15px;
  font-family: 'Outfit', sans-serif;
  letter-spacing: 4px;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 2px;
  position: relative;
  transition: all 0.35s ease;
  backdrop-filter: blur(5px);
  overflow: hidden;
}

.landing-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255, 153, 51, 0.12);
  transform: translateX(-100%);
  transition: transform 0.35s ease;
}

.landing-btn:hover::before {
  transform: translateX(0);
}

.landing-btn:hover {
  box-shadow: 0 0 30px rgba(255, 153, 51, 0.4), 0 0 60px rgba(255, 153, 51, 0.15);
  color: #fff;
}

/* Authentication Page Styles */
.login-wrapper {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 10;
}

.login-card {
  width: 420px;
  background: rgba(10, 12, 16, 0.6);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 153, 51, 0.3);
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(19, 136, 8, 0.1);
  display: flex;
  flex-direction: column;
  gap: 24px;
  animation: fadeIn 0.5s ease-out;
  position: relative;
  z-index: 2;
}

.login-header {
  text-align: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  padding-bottom: 24px;
}

.login-header h2 {
  font-family: 'Outfit', sans-serif;
  color: #fff;
  letter-spacing: 4px;
  margin: 16px 0 8px 0;
  font-size: 22px;
}

.status-text {
  font-family: monospace;
  color: #138808;
  font-size: 12px;
  letter-spacing: 1px;
}

.status-text.pulse {
  animation: textPulse 1s infinite;
  color: #FF9933;
}

@keyframes textPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.input-group label {
  font-family: monospace;
  font-size: 11px;
  color: #E3D8A2;
  letter-spacing: 2px;
}

.input-group input {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 14px;
  color: #fff;
  font-family: monospace;
  font-size: 14px;
  border-radius: 6px;
  outline: none;
  transition: all 0.3s;
}

.input-group input:focus {
  border-color: #FF9933;
  box-shadow: 0 0 15px rgba(255, 153, 51, 0.2);
}

.auth-scanning-bar {
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  overflow: hidden;
}

.auth-scanning-fill {
  height: 100%;
  background: linear-gradient(90deg, #FF9933, #138808, #FF9933);
  background-size: 200% 100%;
  animation: scanProgress 1.5s ease-in-out infinite;
  border-radius: 2px;
}

@keyframes scanProgress {
  0% { width: 0%; background-position: 0% 0%; }
  50% { width: 70%; background-position: 100% 0%; }
  100% { width: 100%; background-position: 0% 0%; }
}
.auth-btn {
  background: linear-gradient(90deg, rgba(255, 153, 51, 0.8), rgba(19, 136, 8, 0.8));
  color: white;
  border: none;
  padding: 16px;
  border-radius: 6px;
  font-family: 'Outfit', sans-serif;
  letter-spacing: 3px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: transform 0.2s, box-shadow 0.2s;
}

.auth-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(255, 153, 51, 0.3);
}

.auth-btn:disabled {
  background: #4D5363;
  color: #a0a0a0;
  cursor: not-allowed;
}

/* Dashboard Styles */
.dashboard-container {
  display: flex;
  width: 100vw;
  height: 100vh;
  padding: 16px;
  gap: 0;
  box-sizing: border-box;
  position: relative;
  overflow: hidden;
}

.sidebar-trigger {
  position: fixed;
  left: 0;
  top: 0;
  width: 14px;
  height: 100vh;
  z-index: 200;
  cursor: pointer;
}

.sidebar {
  flex-shrink: 0;
  width: 0;
  min-width: 0;
  overflow: hidden;
  background: rgba(10, 12, 16, 0.55);
  border-radius: 12px;
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: width 0.18s cubic-bezier(0.4, 0, 0.2, 1),
              min-width 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  margin-right: 0;
  transition-property: width, min-width, margin-right;
}

.sidebar--open {
  width: 260px;
  min-width: 260px;
  margin-right: 16px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
}


.sidebar-header {
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px 20px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  min-width: 260px;
}

.sidebar-header h1 {
  font-size: 16px;
  font-weight: 700;
  margin: 0;
  color: #fff;
  letter-spacing: 1px;
}

.sidebar-sub {
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 1px;
  margin-top: 2px;
  font-family: monospace;
}

/* Flat sidebar nav */
.sidebar-nav {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
  padding: 0 10px 8px;
  min-width: 260px;
}

.sidebar-nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: none;
  border: none;
  color: rgba(255,255,255,0.45);
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 400;
  cursor: pointer;
  border-radius: 6px;
  text-align: left;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.3px;
}

.sidebar-nav-item:hover {
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.75);
}

.sidebar-nav-item--active {
  background: rgba(255,255,255,0.07);
  color: #fff;
  font-weight: 500;
}

.sidebar-badge {
  background: #e8a838;
  color: #000;
  font-size: 11px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 3px;
  font-family: monospace;
  letter-spacing: 0;
  line-height: 18px;
}

.sidebar-footer {
  border-top: 1px solid rgba(255,255,255,0.07);
  padding: 14px 20px 20px;
  margin-top: 4px;
  min-width: 260px;
}

.sidebar-footer-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  font-family: monospace;
  letter-spacing: 0.5px;
}

.status-dot--sm {
  width: 7px !important;
  height: 7px !important;
  animation: pulse 2s infinite;
}

.sidebar-footer-op {
  font-size: 11px;
  color: rgba(255,255,255,0.3);
  font-family: monospace;
  margin-top: 4px;
  letter-spacing: 0.5px;
}

.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
}

.top-bar {
  height: 64px;
  background: rgba(10, 12, 16, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  display: flex;
  align-items: center;
  padding: 0 24px;
  justify-content: space-between;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
}

.status-indicator {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 600;
  color: var(--color-sage);
  letter-spacing: 1px;
}

.status-dot {
  width: 10px;
  height: 10px;
  background-color: var(--color-sage);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--color-sage);
  animation: pulse 2s infinite;
}

.time-display {
  font-family: monospace;
  font-size: 16px;
  color: var(--color-khaki);
  opacity: 0.8;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(120, 165, 120, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(120, 165, 120, 0); }
  100% { box-shadow: 0 0 0 0 rgba(120, 165, 120, 0); }
}

.top-bar-title {
  font-size: 20px;
  font-weight: 600;
  color: #fff;
  margin: 0;
  letter-spacing: 0.3px;
}

.top-bar-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-family: monospace;
  color: rgba(255,255,255,0.45);
  letter-spacing: 1px;
}

.meta-sep {
  color: rgba(255,255,255,0.15);
}

.meta-online {
  color: #78A578;
  font-weight: 600;
}

/* Stats row */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  flex-shrink: 0;
}

.stat-card {
  background: rgba(10,12,16,0.5);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 18px 20px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.stat-card-label {
  font-family: monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.35);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.stat-card-val {
  font-size: 32px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.5px;
  line-height: 1;
  margin-bottom: 6px;
  font-family: 'Outfit', sans-serif;
}

.stat-card-sub {
  font-size: 12px;
  color: rgba(255,255,255,0.35);
  font-family: monospace;
  letter-spacing: 0.5px;
}

/* Main dash grid */
.dash-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 12px;
  min-height: 0;
}

/* Border Map */
.border-map-panel {
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}

.panel-head-title {
  font-family: monospace;
  font-size: 11px;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.55);
  font-weight: 600;
  text-transform: uppercase;
}

.panel-head-right {
  font-family: monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.25);
  letter-spacing: 1px;
}

.border-map-area {
  flex: 1;
  position: relative;
  overflow: hidden;
}

.map-fence {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.map-cam {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 7px;
  transform: translate(-50%, -50%);
}

.map-cam-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.map-cam--online .map-cam-dot {
  background: #78A578;
  box-shadow: 0 0 8px rgba(120,165,120,0.6);
}

.map-cam--incident .map-cam-dot {
  background: #ff4a4a;
  box-shadow: 0 0 10px rgba(255,74,74,0.7);
  animation: blink 1s infinite;
}

.map-cam-label {
  font-family: monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.55);
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.map-cam--incident .map-cam-label {
  color: rgba(255,74,74,0.85);
}

/* Incidents panel */
.incidents-panel {
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
}

.incident-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 8px 0;
}

.incident-row {
  display: flex;
  align-items: flex-start;
  gap: 0;
  padding: 14px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: background 0.15s;
}

.incident-row:hover {
  background: rgba(255,255,255,0.03);
}

.incident-sev {
  width: 3px;
  border-radius: 2px;
  align-self: stretch;
  flex-shrink: 0;
  margin-right: 14px;
  opacity: 0.9;
}

.incident-info {
  flex: 1;
  min-width: 0;
}

.incident-title {
  font-size: 13px;
  color: rgba(255,255,255,0.85);
  font-weight: 500;
  margin-bottom: 4px;
  font-family: 'Outfit', sans-serif;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.incident-meta {
  font-family: monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.3);
  letter-spacing: 0.5px;
}

.incident-scores {
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: right;
  font-family: monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.3);
  letter-spacing: 0.5px;
  flex-shrink: 0;
  margin-left: 12px;
}

.score-val {
  color: rgba(255,255,255,0.65);
  font-weight: 600;
}

.menu-toggle {
  background: rgba(120, 165, 120, 0.15);
  border: 1px solid rgba(120, 165, 120, 0.3);
  color: var(--color-sage);
  width: 36px;
  height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  padding: 0;
}
.menu-toggle:hover {
  background: rgba(120, 165, 120, 0.3);
  box-shadow: 0 0 10px rgba(120, 165, 120, 0.3);
}

.panel-label {
  position: absolute;
  top: 12px;
  left: 16px;
  font-size: 10px;
  font-weight: 600;
  color: var(--color-sage);
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: 0.7;
}

.threat-panel {
  grid-column: 1 / 3;
  padding: 16px;
}

.threat-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 8px;
}

.threat-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  font-family: monospace;
  color: #ff6b6b;
  letter-spacing: 1px;
  padding: 8px 12px;
  background: rgba(255, 75, 75, 0.08);
  border: 1px solid rgba(255, 75, 75, 0.2);
  border-radius: 6px;
}

.threat-dot {
  width: 8px;
  height: 8px;
  background: #ff4a4a;
  border-radius: 50%;
  box-shadow: 0 0 8px #ff4a4a;
  flex-shrink: 0;
  animation: blink 1.2s infinite;
}

.error-msg {
  color: #ff6b6b;
  font-family: monospace;
  font-size: 12px;
  letter-spacing: 1px;
  padding: 8px 12px;
  background: rgba(255, 75, 75, 0.1);
  border: 1px solid rgba(255, 75, 75, 0.3);
  border-radius: 6px;
  text-align: center;
}

.login-hint {
  font-size: 11px;
  color: rgba(255,255,255,0.3);
  text-align: center;
  margin: 0;
  font-family: monospace;
  letter-spacing: 1px;
}



.panel {
  background: rgba(10, 12, 16, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  padding: 24px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
}

.map-panel {
  grid-column: 1 / 2;
  grid-row: 1 / 3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, rgba(26,34,32,0.8) 0%, rgba(10,12,16,0.8) 100%);
  border: 1px solid var(--color-olive);
  padding: 0;
}

.map-grid {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: 
    linear-gradient(rgba(120, 165, 120, 0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120, 165, 120, 0.1) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.radar-container {
  width: 400px;
  height: 400px;
  border-radius: 50%;
  border: 1px solid rgba(120, 165, 120, 0.3);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.radar-container::before, .radar-container::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(120, 165, 120, 0.2);
}

.radar-container::before { width: 66%; height: 66%; }
.radar-container::after { width: 33%; height: 33%; }

.radar-crosshair {
  position: absolute;
  width: 100%;
  height: 100%;
}
.radar-crosshair::before, .radar-crosshair::after {
  content: '';
  position: absolute;
  background: rgba(120, 165, 120, 0.3);
}
.radar-crosshair::before { top: 0; bottom: 0; left: 50%; width: 1px; }
.radar-crosshair::after { left: 0; right: 0; top: 50%; height: 1px; }

.radar-sweep {
  position: absolute;
  width: 50%;
  height: 50%;
  top: 0;
  right: 0;
  transform-origin: bottom left;
  background: conic-gradient(from 0deg, transparent 70%, rgba(120, 165, 120, 0.5) 100%);
  animation: spin 3s linear infinite;
}

.blip {
  position: absolute;
  width: 6px;
  height: 6px;
  background: var(--color-khaki);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--color-khaki);
  opacity: 0;
  animation: blipFade 3s linear infinite;
}

.blip-1 { top: 25%; left: 60%; animation-delay: 0.5s; }
.blip-2 { top: 70%; left: 30%; animation-delay: 2.2s; }
.blip-3 { top: 40%; left: 80%; animation-delay: 1.1s; }

@keyframes blipFade {
  0% { opacity: 1; }
  20% { opacity: 0; }
  100% { opacity: 0; }
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.cam-panel {
  display: flex;
  flex-direction: column;
  padding: 12px;
}

.cam-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.cam-header h3 {
  margin: 0;
  font-size: 12px;
  color: var(--color-khaki);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.cam-feed {
  flex: 1;
  background: #050608;
  border-radius: 8px;
  border: 1px solid var(--color-slate);
  position: relative;
  overflow: hidden;
  background-image: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.15"/></svg>');
}

.cam-feed::after {
  content: "REC";
  position: absolute;
  top: 12px;
  right: 12px;
  color: #ff4a4a;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
}

.cam-feed::before {
  content: "";
  position: absolute;
  top: 15px;
  right: 44px;
  width: 8px;
  height: 8px;
  background: #ff4a4a;
  border-radius: 50%;
  animation: blink 1s infinite;
  z-index: 10;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

.scanline {
  width: 100%;
  height: 100%;
  background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(120, 165, 120, 0.1) 50%, rgba(120, 165, 120, 0.1));
  background-size: 100% 4px;
  position: absolute;
  pointer-events: none;
  animation: scroll 10s linear infinite;
}

@keyframes scroll {
  from { background-position: 0 0; }
  to { background-position: 0 100%; }
}

::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--color-slate);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--color-sage);
}

/* Live Surveillance Grid */
.live-surveillance-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 16px;

}

.cam-tile {

.cam-tile-header {

.cam-live-dot {

.cam-placeholder {

.cam-video {

}

.cam-overlay {
  position: absolute;

}

.cam-scanline {
  width: 100%;
  height: 100%;
  background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(120, 165, 120, 0.05) 50%, rgba(120, 165, 120, 0.05));

}

.cam-crosshair {
  position: absolute;
  top: 50%; left: 50%;

}
.cam-crosshair::before, .cam-crosshair::after {

}
.cam-crosshair::before { top: -10px; bottom: -10px; left: 50%; width: 1px; }
.cam-crosshair::after { left: -10px; right: -10px; top: 50%; height: 1px; }

.cam-alert-overlay {

}

.bm-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.bm-cam-node {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}

.bm-cam-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  position: relative;
  z-index: 2;
}

.bm-cam-pulse {
  position: absolute;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: bm-pulse 2s infinite;
  z-index: 1;
}

@keyframes bm-pulse {
  0% { transform: translate(-50%,-50%) scale(0.8); opacity: 0.6; }
  100% { transform: translate(-50%,-50%) scale(2.2); opacity: 0; }
}

.bm-cam-node--online .bm-cam-dot { background: #78A578; box-shadow: 0 0 8px rgba(120,165,120,0.7); }

/* =====================================================

   Inspired by Win11 Mica/Acrylic material
   ===================================================== */

/* Global acrylic mixin via CSS variable */
:root {
  --acrylic-bg: rgba(14, 17, 23, 0.82);
  --acrylic-bg-strong: rgba(14, 17, 23, 0.90);
  --acrylic-bg-subtle: rgba(14, 17, 23, 0.72);
  --acrylic-border: rgba(255, 255, 255, 0.08);
  --acrylic-blur: 24px;
}

/* Top bar */
.top-bar {
  background: var(--acrylic-bg-strong) !important;
  backdrop-filter: blur(var(--acrylic-blur)) saturate(1.4) !important;
  -webkit-backdrop-filter: blur(var(--acrylic-blur)) saturate(1.4) !important;
  border-bottom: 1px solid var(--acrylic-border) !important;
}

/* Sidebar */
.sidebar {
  background: var(--acrylic-bg-strong) !important;
  backdrop-filter: blur(30px) saturate(1.5) !important;
  -webkit-backdrop-filter: blur(30px) saturate(1.5) !important;
}

/* Stat cards */
.stat-card {
  background: var(--acrylic-bg) !important;
  backdrop-filter: blur(var(--acrylic-blur)) saturate(1.3) !important;
  -webkit-backdrop-filter: blur(var(--acrylic-blur)) saturate(1.3) !important;

/* =====================================================
   FLIPCARD DARK/LIGHT TOGGLE
   ===================================================== */

.fc-wrap {
  width: 64px;
  height: 30px;
  cursor: pointer;
  flex-shrink: 0;
  perspective: 1100px;
  transform-style: preserve-3d;
  border-radius: 8px;
  user-select: none;
}

.fc-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.23, 1, 0.32, 1);
  border-radius: 8px;
}

.fc-inner.fc-flipped {
  transform: rotateY(180deg);
}

.fc-face {
  position: absolute;
  inset: 0;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-family: monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.45);
  border: 1px solid;
}

.fc-front {
  background: rgba(14, 17, 23, 0.85);
  border-color: rgba(120, 165, 120, 0.3);
  color: rgba(255,255,255,0.7);
}

.fc-back {
  background: rgba(240, 235, 220, 0.92);
  border-color: rgba(200,180,100,0.4);
  color: rgba(30,25,15,0.85);
  transform: rotateY(180deg);
}

.fc-glare {
  position: absolute;
  inset: 0;
  border-radius: 8px;
  pointer-events: none;
}

    function handleResize() {
      const w = window.innerWidth, h = window.innerHeight;
      if (!w || !h) return;
      const ca = w / h;
      _renderer.setSize(w, h);
      if (_plane) _plane.scale.set(ca, 1, 1);
      _camera.left = -ca / 2; _camera.right = ca / 2;
      _camera.top = 0.5;      _camera.bottom = -0.5;
      _camera.updateProjectionMatrix();
      _uniforms.resolution.value.set(w, h, 1, 1);
    }

    document.addEventListener('mousemove', e => {
      const x = e.clientX / window.innerWidth;
      const y = 1 - e.clientY / window.innerHeight;
      ms.vX = x - ms.prevX; ms.vY = y - ms.prevY;
      Object.assign(ms, { x, y, prevX: x, prevY: y });
    });
    document.addEventListener('mouseleave', () => {
      Object.assign(ms, { x:0, y:0, prevX:0, prevY:0, vX:0, vY:0 });
    });

    function runLoop() {
      _animId = requestAnimationFrame(runLoop);
      _uniforms.time.value += 0.05;
      const d = _dataTex.image.data, size = GRID;
      for (let i = 0; i < size * size; i++) {
        d[i * 4]     *= RELAX;
        d[i * 4 + 1] *= RELAX;
      }
      const gmx = size * ms.x, gmy = size * ms.y, maxDist = size * MOUSE_R;
      for (let i = 0; i < size; i++) {
        for (let j = 0; j < size; j++) {
          const dx = gmx - i, dy = gmy - j;
          const distSq = dx * dx + dy * dy;
          if (distSq < maxDist * maxDist) {
            const idx = 4 * (i + size * j);
            const power = Math.min(maxDist / Math.sqrt(distSq), 10);
            d[idx]     += STRENGTH * 100 * ms.vX * power;
            d[idx + 1] -= STRENGTH * 100 * ms.vY * power;
          }
        }
      }
      _dataTex.needsUpdate = true;
      _renderer.render(_scene, _camera);
    }

    window.setBgMode = (mode) => {
      const el = document.getElementById('grid-bg');
      if (mode === 'light') {
        el.style.filter = 'brightness(1.45) saturate(1.1) contrast(0.92)';
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        el.style.filter = 'brightness(0.5) contrast(1.08)';
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    };
    window.showGridBg = (show) => {
      container.style.opacity = show ? 1 : 0;
      if (show) initGD();
    };

      const navRef=useRef(null),heads=useRef([]),markerRef=useRef(null),latest=useRef({});
      latest.current={onSelect,onToggle};
      const activeSection=items.findIndex(it=>it.children?.some(kid=>kid.value===active));
      const markerShown=activeSection>=0&&open.has(activeSection);
      useLayoutEffect(()=>{
        const place=glide=>{
          const m=markerRef.current,el=heads.current[activeSection];
          if(!m)return;const on=markerShown&&el;
          if(!glide)m.style.transition='none';
          if(on)m.style.top=`${el.offsetTop+(el.offsetHeight-MARK)/2}px`;
          if(on)m.setAttribute('data-on','true');else m.removeAttribute('data-on');
          if(!glide){void m.offsetHeight;m.style.transition='';}
        };
        place(true);let first=true;
        const hr=()=>{if(first){first=false;return;}place(false);};
        window.addEventListener('resize',hr);return()=>window.removeEventListener('resize',hr);
      },[activeSection,markerShown,items,fontSize,rowHeight]);
      const select=(value,item)=>{setActive(value);if(latest.current.onSelect)latest.current.onSelect(value,item);};
      const toggle=i=>{setOpen(prev=>{const next=new Set(prev);if(!next.has(i))next.add(i);else next.delete(i);if(latest.current.onToggle)latest.current.onToggle(i,!prev.has(i));return next;});};
      const r=Math.min(radius,rowHeight/2-2),endX=indent-8;
      const rowY=k=>PAD+k*rowHeight+rowHeight/2;
      const branch=k=>`M ${trunk} ${rowY(k)-r} A ${r} ${r} 0 0 0 ${trunk+r} ${rowY(k)} H ${endX}`;
      const reach=k=>`M ${trunk} 0 V ${rowY(k)-r} A ${r} ${r} 0 0 0 ${trunk+r} ${rowY(k)} H ${endX}`;
      const length=k=>rowY(k)-r+(Math.PI*r)/2+(endX-trunk-r);
      return (
        <nav ref={navRef} className={`branched-menu${className?` ${className}`:''}`}
          style={{'--bm-w':`${width}px`,'--bm-ink':color,'--bm-accent':accentColor,'--bm-line':lineColor,'--bm-font':`${fontSize}px`,'--bm-row':`${rowHeight}px`,'--bm-indent':`${indent}px`,'--bm-line-w':lineWidth,'--bm-draw':`${drawDuration}ms`,'--bm-fold':`${foldDuration}ms`}}>
          <span ref={markerRef} className="branched-menu__marker" aria-hidden="true"/>
          {items.map((item,i)=>{
            const kids=item.children,isOpen=kids?open.has(i):false;
            const leafValue=item.value??item.label,leafActive=!kids&&leafValue===active;
            const bodyH=kids?PAD*2+kids.length*rowHeight:0;
            return (
              <div key={item.value??item.label} className="branched-menu__section" data-open={isOpen?'':undefined}>
                <button ref={el=>{heads.current[i]=el;}} type="button" className="branched-menu__head"
                  aria-expanded={kids?isOpen:undefined} aria-current={leafActive?'true':undefined}
                  data-active={leafActive?'':undefined} onClick={()=>(kids?toggle(i):select(leafValue,item))}>
                  {item.label}
                </button>
                {kids?(
                  <div className="branched-menu__body"><div className="branched-menu__fold">
                    <div className="branched-menu__tree" style={{height:bodyH}}>
                      <svg className="branched-menu__lines" width={indent} height={bodyH} aria-hidden="true">
                        <path className="branched-menu__base" d={`M ${trunk} 0 V ${rowY(kids.length-1)-r}`}/>
                        {kids.map((kid,k)=><path key={kid.value} className="branched-menu__base" d={branch(k)}/>)}
                        {kids.map((kid,k)=>(<path key={kid.value} className="branched-menu__reach" d={reach(k)} style={{strokeDasharray:length(k),strokeDashoffset:kid.value===active?0:length(k)}}/>))}
                      </svg>
                      {kids.map(kid=>(
                        <button key={kid.value} type="button" className="branched-menu__item"
                          aria-current={kid.value===active?'true':undefined} data-active={kid.value===active?'':undefined}
                          tabIndex={isOpen?0:-1} onClick={()=>select(kid.value,kid)}>
                          {kid.icon?<span className="branched-menu__icon" aria-hidden="true">{renderIconItem(kid.icon)}</span>:null}
                          <span className="branched-menu__label">{kid.label}</span>
                        </button>
                      ))}
                    </div>
                  </div></div>
                ):null}
              </div>
            );
          })}
        </nav>
      );
    }

    function TypeWriter({ texts, speed=60, pause=2200 }) {
      const [display, setDisplay] = useState('');
      const [tIdx, setTIdx] = useState(0);
      const [cIdx, setCIdx] = useState(0);
      const [deleting, setDeleting] = useState(false);
      useEffect(() => {
        const current = texts[tIdx];
        const delay = deleting ? speed / 2 : speed;
        const t = setTimeout(() => {
          if (!deleting && cIdx < current.length) {
            setDisplay(current.slice(0, cIdx + 1));
            setCIdx(c => c + 1);
          } else if (!deleting && cIdx === current.length) {
            setTimeout(() => setDeleting(true), pause);
          } else if (deleting && cIdx > 0) {
            setDisplay(current.slice(0, cIdx - 1));
            setCIdx(c => c - 1);
          } else {
            setDeleting(false);
            setTIdx(i => (i + 1) % texts.length);
          }
        }, delay);
        return () => clearTimeout(t);
      }, [cIdx, deleting, tIdx]);
      return <span>{display}<span className="cursor-blink">|</span></span>;
    }

        canvas.width=80;canvas.height=45;
        canvasRef.current=canvas;
        const ctx=canvas.getContext('2d');
        const interval=setInterval(()=>{
          const vid=videoRef.current;
          if(!vid||vid.readyState<2)return;
          ctx.drawImage(vid,0,0,80,45);
          const frame=ctx.getImageData(0,0,80,45).data;
          if(lastFrameRef.current){
            let diff=0,dark=0,total=frame.length/4;
            for(let i=0;i<frame.length;i+=4){
              diff+=Math.abs(frame[i]-lastFrameRef.current[i])+Math.abs(frame[i+1]-lastFrameRef.current[i+1])+Math.abs(frame[i+2]-lastFrameRef.current[i+2]);
              if((frame[i]+frame[i+1]+frame[i+2])/3<12)dark++;
            }
            const avgDiff=diff/(total*3);
            const darkRatio=dark/total;
            if(darkRatio>0.72){setTamperStatus('BLACKOUT / TAMPER SUSPECTED');}
            else if(avgDiff>90){setTamperStatus('ANGLE DRIFT DETECTED');}
            else{setTamperStatus('NOMINAL');}
            if(avgDiff<0.8){frozenCountRef.current++;if(frozenCountRef.current>6)setFreezeDetected(true);}
            else{frozenCountRef.current=0;setFreezeDetected(false);}
          }
          lastFrameRef.current=new Uint8Array(frame);
        },500);
        return()=>clearInterval(interval);

        setIncidentSimulated(true);

      };

                  {[
                    {id:'#1044',desc:'Recon pattern - north fence',cameras:'CAM-07, CAM-09',time:'13:30:22',ai:88,ev:81,severity:'high',intent:'RECON-PATTERN',awaitingConfirm:false},
                    {id:'#1043',desc:'Unauthorized vehicle near gate',cameras:'CAM-03',time:'12:44:18',ai:74,ev:69,severity:'medium',intent:'STATIC',awaitingConfirm:false},
                    {id:'#1042',desc:'Night movement thermal signature',cameras:'CAM-09',time:'02:11:55',ai:61,ev:53,severity:'low',intent:'CROSSING',awaitingConfirm:false},
                  ].map(inc=>(
                    <div key={inc.id} className={`incidents-table-row incidents-table-row--${inc.severity}`}>
                      <span className="inc-id">{inc.id}</span>
                      <span className="inc-desc">{inc.desc}</span>
                      <span><span className="intent-tag" style={{borderColor:({CROSSING:'#ff4a4a',LOITERING:'#e8a838',STATIC:'#5890c8','RECON-PATTERN':'#c85890'})[inc.intent]||'#888',color:({CROSSING:'#ff4a4a',LOITERING:'#e8a838',STATIC:'#5890c8','RECON-PATTERN':'#c85890'})[inc.intent]||'#888'}}>{inc.intent}</span></span>
                      <span className="inc-cams">{inc.cameras}</span>
                      <span className="inc-time">{inc.time}</span>
                      <span className="inc-score">{inc.ai}%</span>
                      <span className="inc-score">{inc.ev}%</span>
                      <span><span className="inc-status-badge inc-status-badge--open">OPEN</span></span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeView==='evidence'&&(
              <div className="evidence-grid">
                {[
                  {inc:'#1047',type:'FRAME CAPTURE',cam:'CAM-07',time:'14:31:04',size:'2.4 MB',res:'1920x1080',custody:['14:31:05 System auto-capture','14:32:10 Operator BOP-07 reviewed','14:35:00 Flagged for escalation']},
                  {inc:'#1047',type:'VIDEO CLIP',cam:'CAM-08',time:'14:31:00',size:'18.7 MB',res:'1280x720 / 30s',custody:['14:31:00 System auto-record','14:32:45 Operator BOP-07 verified']},
                  {inc:'#1047',type:'METADATA LOG',cam:'CAM-07',time:'14:31:04',size:'12 KB',res:'JSON / AI scores',custody:['14:31:04 System generated','14:33:00 Integrity hash verified']},
                  {inc:'#1046',type:'FRAME CAPTURE',cam:'CAM-12',time:'14:28:04',size:'2.1 MB',res:'1920x1080',custody:['14:28:05 System auto-capture','14:29:30 Operator BOP-07 reviewed']},
                  {inc:'#1044',type:'VIDEO CLIP',cam:'CAM-07',time:'13:30:22',size:'42.1 MB',res:'1280x720 / 80s',custody:['13:30:22 System auto-record','13:31:55 Flagged by AI pattern engine']},
                  {inc:'#1043',type:'FRAME CAPTURE',cam:'CAM-03',time:'12:44:18',size:'1.9 MB',res:'1920x1080',custody:['12:44:19 System auto-capture']},
                ].map((ev,i)=>(
                  <div key={i} className="evidence-card">
                    <div className="evidence-card-header">
                      <span className="evidence-type">{ev.type}</span>
                      <span className="evidence-inc-ref">{ev.inc}</span>
                    </div>
                    <div className="evidence-card-body">
                      <div className="evidence-field"><span>Camera</span><span>{ev.cam}</span></div>
                      <div className="evidence-field"><span>Timestamp</span><span>{ev.time}</span></div>
                      <div className="evidence-field"><span>Size</span><span>{ev.size}</span></div>
                      <div className="evidence-field"><span>Details</span><span>{ev.res}</span></div>
                    </div>
                    <div className="evidence-custody">
                      <div className="evidence-custody-title">CHAIN OF CUSTODY</div>
                      {ev.custody.map((c,j)=>(
                        <div key={j} className="evidence-custody-entry">{c}</div>
                      ))}
                    </div>
                    <button className="ev-download-btn" onClick={()=>{
                      const data=JSON.stringify({incident:ev.inc,type:ev.type,camera:ev.cam,timestamp:ev.time,size:ev.size,resolution:ev.res,chain_of_custody:ev.custody},null,2);
                      const blob=new Blob([data],{type:'application/json'});
                      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='evidence-'+ev.inc.replace('#','')+'-'+ev.type.toLowerCase().replace(' ','-')+'.json';a.click();
                    }}>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                      DOWNLOAD
                    </button>
                  </div>
                ))}
              </div>
            )}

            {activeView==='audit-trail'&&(
              <div className="audit-trail-view">
                <div className="audit-toolbar">
                  <div className="audit-title-info">System event log / All operators / Sector 07</div>
                  <div className="audit-count">24 events today</div>
                </div>
                <div className="audit-log">
                  {[
                    {time:'14:35:00',type:'ESCALATION',actor:'BOP-07',action:'Incident #1047 flagged for escalation. Second authorization pending.'},
                    {time:'14:33:10',type:'AI-ALERT',actor:'SYSTEM',action:'Intent reclassified: CAM-07 subject pattern changed from STATIC to CROSSING.'},
                    {time:'14:31:04',type:'INCIDENT',actor:'SYSTEM',action:'Incident #1047 created. AI score 91%, EV score 86%. CAM-07>CAM-08>CAM-09.'},
                    {time:'14:31:00',type:'TAMPER',actor:'SYSTEM',action:'CAM-08 signal lost. Tamper/blackout detection triggered. Integrity score: FAILED.'},
                    {time:'14:28:04',type:'INCIDENT',actor:'SYSTEM',action:'Incident #1046 created. Loitering detected at CAM-12. 9 direction reversals in 18m.'},
                    {time:'14:20:00',type:'AUTH',actor:'BOP-07',action:'Operator BOP-07 authenticated. Session token issued.'},
                    {time:'14:15:33',type:'SYSTEM',actor:'SYSTEM',action:'All cameras nominal. Perimeter integrity check passed.'},
                    {time:'14:02:11',type:'SYSTEM',actor:'SYSTEM',action:'CAM-09 baseline reference frame updated. Tamper detection reset.'},
                    {time:'14:00:00',type:'SYSTEM',actor:'SYSTEM',action:'Scheduled integrity verification completed. 5/6 cameras NOMINAL. 1 DEGRADED (CAM-12).'},
                    {time:'13:52:11',type:'INCIDENT',actor:'SYSTEM',action:'Incident #1045 created. Unattended object detected at CAM-03. AI 64%, EV 58%.'},
                    {time:'13:30:22',type:'INCIDENT',actor:'SYSTEM',action:'Incident #1044 created. Recon pattern on north fence. 5 perimeter approach vectors in 47m.'},
                    {time:'13:00:00',type:'SYSTEM',actor:'SYSTEM',action:'Edge sync completed. 0 queued events pending.'},
                    {time:'12:44:18',type:'INCIDENT',actor:'SYSTEM',action:'Incident #1043 created. Unauthorized vehicle detected at CAM-03. AI 74%, EV 69%.'},
                    {time:'06:00:00',type:'SYSTEM',actor:'SYSTEM',action:'System boot. All 6 camera nodes connected. Non-FRT re-ID engine initialized.'},
                  ].map((entry,i)=>(
                    <div key={i} className="audit-entry">
                      <div className="audit-entry-time">{entry.time}</div>
                      <div className={`audit-entry-type audit-entry-type--${entry.type.toLowerCase().replace('-','')}`}>{entry.type}</div>
                      <div className="audit-entry-actor">{entry.actor}</div>
                      <div className="audit-entry-action">{entry.action}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeView==='account'&&(
              <div className="account-view">
                <div className="account-profile-card">
                  <div className="account-avatar">B7</div>
                  <div className="account-info">
                    <div className="account-name">OPERATOR BOP-07</div>
                    <div className="account-rank">Sub-Inspector / Sector Commander</div>
                    <div className="account-badges">
                      <span className="account-badge account-badge--active">ACTIVE SESSION</span>
                      <span className="account-badge account-badge--clearance">CLEARANCE LVL 3</span>
                    </div>
                  </div>
                </div>
                <div className="account-grid">
                  <div className="account-section">
                    <div className="account-section-title">SESSION INFO</div>
                    <div className="account-field"><span>Login Time</span><span>14:00:00 ZULU</span></div>
                    <div className="account-field"><span>Shift</span><span>Alpha Shift (0800-2000)</span></div>
                    <div className="account-field"><span>Station</span><span>BOP-07 / Sector 07-Alpha</span></div>
                    <div className="account-field"><span>IP Terminal</span><span>10.7.0.14</span></div>
                    <div className="account-field"><span>Auth Method</span><span>RFID + Biometric</span></div>
                  </div>
                  <div className="account-section">
                    <div className="account-section-title">ACCESS PERMISSIONS</div>
                    <div className="account-field"><span>Live Surveillance</span><span className="perm-ok">GRANTED</span></div>
                    <div className="account-field"><span>Evidence Vault</span><span className="perm-ok">GRANTED</span></div>
                    <div className="account-field"><span>Incident Close</span><span className="perm-ok">GRANTED</span></div>
                    <div className="account-field"><span>4-Eyes Escalation</span><span className="perm-ok">GRANTED</span></div>
                    <div className="account-field"><span>System Config</span><span className="perm-deny">DENIED</span></div>
                    <div className="account-field"><span>Export Classified</span><span className="perm-deny">DENIED</span></div>
                  </div>
                  <div className="account-section">
                    <div className="account-section-title">ACTIVITY TODAY</div>
                    <div className="account-field"><span>Incidents Reviewed</span><span>6</span></div>
                    <div className="account-field"><span>Alerts Actioned</span><span>3</span></div>
                    <div className="account-field"><span>Evidence Downloads</span><span>2</span></div>
                    <div className="account-field"><span>4-Eyes Escalations</span><span>1</span></div>
                    <div className="account-field"><span>Camera Reviews</span><span>12</span></div>
                  </div>
                  <div className="account-section">
                    <div className="account-section-title">DOWNLOAD FULL REPORT</div>
                    <div style={{padding:'16px 0',display:'flex',flexDirection:'column',gap:'10px'}}>
                      <button className="account-dl-btn" onClick={()=>{
                        const r='SEEMA-DRISHTI OPERATOR REPORT\nOperator: BOP-07\nDate: '+new Date().toDateString()+'\nShift: Alpha 0800-2000\nIncidents: 6 reviewed\nEscalations: 1\nStation: BOP-07 Sector 07-Alpha';
                        const b=new Blob([r],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='operator-report-BOP07-'+Date.now()+'.txt';a.click();
                      }}>DOWNLOAD SHIFT REPORT</button>
                      <button className="account-dl-btn account-dl-btn--secondary" onClick={()=>{
                        const r=JSON.stringify({operator:'BOP-07',date:new Date().toISOString(),incidents_reviewed:6,alerts_actioned:3,escalations:1,evidence_downloads:2,camera_reviews:12},null,2);
                        const b=new Blob([r],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='activity-log-BOP07-'+Date.now()+'.json';a.click();
                      }}>DOWNLOAD ACTIVITY LOG (JSON)</button>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }



    function App(){
      const [appState,setAppState]=useState('landing');
      const [prevState,setPrevState]=useState('landing');
      const [time,setTime]=useState(new Date().toLocaleTimeString('en-US',{hour12:false})+" ZULU");
      useEffect(()=>{
        const t=setInterval(()=>setTime(new Date().toLocaleTimeString('en-US',{hour12:false})+" ZULU"),1000);
        return()=>clearInterval(t);
      },[]);
      useEffect(()=>{
        if(appState==='dashboard'){if(window.setAuroraState)window.setAuroraState(0);if(window.showGridBg)window.showGridBg(true);}
        else{if(window.showGridBg)window.showGridBg(false);}
      },[appState]);
      const goLegal=(page)=>{ setPrevState(appState); setAppState(page); };
      const goBack=()=>setAppState(prevState);
      if(appState==='privacy')return<PrivacyPage onBack={goBack}/>;
      if(appState==='terms')return<TermsPage onBack={goBack}/>;
      if(appState==='landing')return<LandingPage onEnter={()=>setAppState('signin')} onPrivacy={()=>goLegal('privacy')} onTerms={()=>goLegal('terms')}/>;
      if(appState==='signin')return<SignInPage onSignIn={()=>setAppState('dashboard')}/>;
      return<Dashboard time={time}/>;    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
